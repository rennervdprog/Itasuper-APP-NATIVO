name: Android Release AAB and APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Número interno crescente. Use sempre um número maior que a versão já instalada, por exemplo 12."
        required: true
        default: "12"
        type: string
      version_name:
        description: "Versão exibida ao cliente, por exemplo 1.0.11"
        required: true
        default: "1.0.11"
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build signed Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      APP_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate release inputs and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code deve ser um número inteiro maior que zero."; exit 1; }
          test -n "$APP_VERSION_NAME" || { echo "version_name não pode ficar vazio."; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_UPLOAD_KEYSTORE_BASE64 não configurado."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD não configurado."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS não configurado."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD não configurado."; exit 1; }
          echo "Gerando versão $APP_VERSION_NAME (code $APP_VERSION_CODE)."

      - name: Restore signing key in ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/itasuper-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$KEYSTORE_PATH" keystore.properties

      - name: Build signed release artifacts
        shell: bash
        run: ./gradlew --no-daemon --max-workers=1 :app:bundleRelease :app:assembleRelease

      - name: Publish signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: itasuper-cliente-aab-v${{ inputs.version_name }}-code${{ inputs.version_code }}-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itasuper-cliente-apk-v${{ inputs.version_name }}-code${{ inputs.version_code }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/itasuper-upload-key.jks"
